# ============================================================
# nginx reverse-proxy snippet for the Bondada Foundation API
# Place in /etc/nginx/sites-available/, symlink to sites-enabled/,
# then `sudo certbot --nginx -d api.bondadafoundation.org` for TLS.
# ============================================================

server {
    listen 80;
    server_name api.bondadafoundation.org;

    client_max_body_size 10M;  # allow the 5MB x 5 file uploads with headroom

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
